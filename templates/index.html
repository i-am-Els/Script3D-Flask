<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Script3D Chat Interface</title>
    <!-- Font Awesome CDN for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/main.css') }}">
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        Script3D Chat Interface
    </div>
    <div class="flash-messages">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>
    <div class="chat-messages" id="chatMessages">
        <!-- Chat messages will be appended here -->
    </div>
    <!-- Add selected file display -->
    <div class="selected-file" style="display: none;">
        <span id="fileName"></span>
        <button id="clearFileBtn">×</button>
    </div>
    <div class="chat-footer">
        <!-- Inside the chat-footer div, modify the chat-input-container -->
        <div class="chat-input-container">
            <!-- Add file upload button -->
            <label for="fileInput" class="upload-btn" title="Upload PDF, TXT, or Fountain file">
                <i class="fas fa-plus"></i>
                <input type="file" id="fileInput" accept=".pdf,.txt,.fountain" style="display: none;">
            </label>

            <textarea 
                id="chatInput" 
                placeholder="Paste your screenplay text here or use the upload button to select a file..."
                title="You can either paste your screenplay text here or upload a file"></textarea>
            <button id="sendBtn" title="Send Message"><i class="fas fa-paper-plane"></i></button>
            <button id="retryBtn" title="Retry Chat"><i class="fas fa-redo"></i></button>
        </div>
        <div id="creditSpan">Script3D Product of Olawale Eniola Emmanuel...</div>
    </div>
</div>

<!-- JSON side panel -->
<div id="jsonViewPanel"></div>
<!-- Bookmark-style toggle tab -->
<div id="toggleTab" title="Toggle JSON view">JSON</div>
<!-- Download JSON button (hidden until available) -->
<button id="downloadJson" title="Download JSON"><i class="fas fa-download"></i></button>

<script type="text/javascript" src="{{ url_for('static', filename='javascript/main.js') }}" defer></script>
</body>
</html>
