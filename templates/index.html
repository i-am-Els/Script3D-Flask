<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenplay Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/main.css') }}">
    <link rel="icon" type="image/png" href="/static/img/icons8-message-16.png"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Main App Container -->
    <div class="app-container">
        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Header Bar -->
            <header class="top-bar">
                <div class="breadcrumb">
                    <i class="fas fa-robot"></i>
                    <span>Screenplay Analysis</span>
                </div>
            </header>

            <!-- Content Wrapper -->
            <div class="content-wrapper">
                <!-- Input Card -->
                <div class="card input-card">
                    <div class="card-header">
                        <h2><i class="fas fa-file-alt"></i> Input Screenplay</h2>
                        <div class="card-actions">
                            <button class="btn-icon" title="Help">
                                <i class="fas fa-question-circle"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="input-group">
                            <textarea id="chatInput" placeholder="Paste your screenplay text here..."></textarea>
                        </div>
                        
                        <div class="upload-zone" id="dropZone">
                            <input type="file" id="fileInput" accept=".pdf,.txt,.fountain" hidden>
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Drag & drop your file here or</p>
                            <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
                                Choose File
                            </button>
                            <p class="file-info">Supports: PDF, TXT, Fountain</p>
                        </div>

                        <div class="selected-file" id="selectedFile" style="display: none;">
                            <i class="fas fa-file-alt"></i>
                            <span id="fileName">filename.txt</span>
                            <button class="btn-icon" onclick="clearFileSelection()">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button class="btn-primary" onclick="startAnalysis()">
                            <i class="fas fa-play"></i>
                            Start Analysis
                        </button>
                    </div>
                </div>

                <!-- Results Section -->
                <div class="card results-card" id="results-section" style="display: none;">
                    <div class="card-header">
                        <h2><i class="fas fa-chart-bar"></i> Analysis Results</h2>
                        <div class="card-actions">
                            <button class="btn-icon" title="Download JSON" onclick="exportComponents()">
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="tabs">
                            <button class="tab-btn active" data-tab="entities">
                                <i class="fas fa-users"></i> Entities
                            </button>
                            <button class="tab-btn" data-tab="interactions">
                                <i class="fas fa-project-diagram"></i> Interactions
                            </button>
                            <button class="tab-btn" data-tab="components">
                                <i class="fas fa-cogs"></i> Components
                            </button>
                            <button class="tab-btn" data-tab="timeline">
                                <i class="fas fa-clock"></i> Timeline
                            </button>
                        </div>
                        
                        <div class="tab-content">
                            <div id="entities-list" class="tab-pane active"></div>
                            <div id="interactions-list" class="tab-pane"></div>
                            <div id="components-list" class="tab-pane"></div>
                            <div id="timeline-list" class="tab-pane">
                                <div class="timeline-tabs">
                                    <button class="timeline-tab-btn active" data-tab="timeline-table">
                                        <i class="fas fa-table"></i> Table
                                    </button>
                                    <button class="timeline-tab-btn" data-tab="timeline-editor">
                                        <i class="fas fa-clock"></i> Timeline Editor
                                    </button>
                                </div>
                                <div class="timeline-tab-content">
                                    <div id="timeline-table" class="timeline-tab-pane active"></div>
                                    <div id="timeline-editor" class="timeline-tab-pane"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Flash Messages Container -->
    <div id="flash-messages"></div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='javascript/main.js') }}"></script>
</body>
</html>
